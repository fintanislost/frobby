name: Publish NuGet

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  publish-nuget:
    name: Publish game-backed packages to nuget.org
    runs-on: ${{ vars.FROBBY_RELEASE_RUNNER || 'ubuntu-latest' }}
    env:
      FROBBY_GAME_PATH: ${{ vars.FROBBY_GAME_PATH }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Validate release environment
        run: ./scripts/release-env-preflight.sh

      - name: Restore
        run: dotnet restore sdv-test-framework.slnx

      - name: Build
        run: |
          build_args=(sdv-test-framework.slnx --configuration Release --no-restore)
          if [ -n "${FROBBY_GAME_PATH:-}" ]; then
            build_args+=("/p:GamePath=$FROBBY_GAME_PATH")
          fi
          dotnet build "${build_args[@]}"

      - name: Test
        run: dotnet test sdv-test-framework.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Release dry-run
        run: ./scripts/release-dry-run.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frobby-nuget-packages
          path: |
            nupkg/*.nupkg
            nupkg/release-dry-run.json
          if-no-files-found: error

      - name: Publish to nuget.org
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is required for tagged NuGet publish." >&2
            exit 1
          fi

          for package in nupkg/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
