name: Release Dry Run

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  release-dry-run:
    name: Build game-backed packages without publishing
    runs-on: ${{ vars.FROBBY_RELEASE_RUNNER || 'ubuntu-latest' }}
    env:
      FROBBY_GAME_PATH: ${{ vars.FROBBY_GAME_PATH }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Validate release environment
        run: ./scripts/release-env-preflight.sh

      - name: Restore
        run: dotnet restore sdv-test-framework.slnx

      - name: Build
        run: |
          build_args=(sdv-test-framework.slnx --configuration Release --no-restore)
          if [ -n "${FROBBY_GAME_PATH:-}" ]; then
            build_args+=("/p:GamePath=$FROBBY_GAME_PATH")
          fi
          dotnet build "${build_args[@]}"

      - name: Test
        run: dotnet test sdv-test-framework.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Release dry-run
        run: ./scripts/release-dry-run.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frobby-release-dry-run-packages
          path: |
            nupkg/*.nupkg
            nupkg/release-dry-run.json
          if-no-files-found: error
